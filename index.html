<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 1. Der Standard für alle PWA-Funktionen (Android, Desktop, modern browsers) -->
<link rel="manifest" href="manifest.json">

<!-- 2. Spezieller Zusatz-Fallback für iOS / Safari -->
<link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Buchstaben-Dobble</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Buchstaben-Dobble">
    <meta name="theme-color" content="#12291b">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Buchstaben-Dobble</h1>

    <div class="sets">
        <button id="set-alle" class="set-btn" onclick="setCardSet('alle')">Alle (9)</button>
        <button id="set-gross" class="set-btn" onclick="setCardSet('gross')">Groß (6)</button>
        <button id="set-klein" class="set-btn" onclick="setCardSet('klein')">Klein (6)</button>
    </div>

    <main>
        <div id="card1" class="card"></div>
        <div id="card2" class="card"></div>
    </main>

    <footer>
        <button id="btn-next" onclick="nextRound()">Nächste Karten 🔄</button>
        <button id="btn-solve" onclick="showSolution()">Auflösen ✨</button>
    </footer>

    <script src="cards.js"></script>
    <script>
        // ------------------------------------------------------------
        // Jede Karte ist ein SVG mit festem Koordinatensystem (270 x 270,
        // Mittelpunkt = 0/0). Das SVG skaliert mit der Kartengröße, deshalb
        // sieht die Anordnung auf jedem Bildschirm gleich aus und muss bei
        // Größenänderung nicht neu berechnet werden.
        //
        // Jedes Zeichen sitzt in einem dünnen Ring. Dessen Größe richtet sich
        // nach dem kleinsten Kreis um die Umrisse des Zeichens (SYM_METRICS
        // in cards.js: Mittelpunkt x, Mittelpunkt y, Radius - in em), sodass
        // der Ring das Zeichen immer umschließt. Die Ringe werden als Kreise
        // platziert: kein Überlappen, mit Mindestabstand, und immer innerhalb
        // des Kartenrands.
        // Buchstaben bleiben aufrecht (keine Drehung), sonst wären b/d/p/q
        // oder n/u nicht mehr unterscheidbar.
        // ------------------------------------------------------------
        const SVG_NS = 'http://www.w3.org/2000/svg';
        const CARD_UNITS = 270;          // Koordinatensystem der Karte
        const R_MAX = 127;               // so weit darf ein Ring vom Mittelpunkt reichen (Kartenrand innen: 135)
        const GAP = 6;                   // Mindestabstand zwischen zwei Ringen
        const RING_PAD = 4;              // Abstand zwischen dem Zeichen und dem Ring
        // Ausgangsschriftgröße (in Karteneinheiten) je Anzahl Zeichen pro Karte:
        // weniger Zeichen -> größere Schrift
        const BASE_PX_BY_COUNT = { 6: 46, 9: 38 };
        const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

        const MAX_CARD_PX = 560;
        const MIN_CARD_PX = 270;
        const CARD_SAFETY_MARGIN_PX = 10;

        let activeCards = CARD_SETS.alle;
        let card1Idx = 0, card2Idx = 1;
        let layout1 = [], layout2 = [];

        function generateLayout(symbols) {
            const count = symbols.length;
            const base = BASE_PX_BY_COUNT[count] || BASE_PX_BY_COUNT[9];
            const items = symbols.map((sym, i) => {
                const px = base * (0.85 + Math.random() * 0.35); // unterschiedliche Größen
                return { i, px, half: SYM_METRICS[sym][2] * px };  // Radius des Kreises um das Zeichen
            });

            // Gleichmäßige Basis-Slots (Sonnenblumen-Verteilung), zufällig zugelost
            const slotMaxR = R_MAX - 35;
            const rot = Math.random() * Math.PI * 2;
            const slots = [];
            for (let k = 0; k < count; k++) {
                const idx = k + 0.5;
                const r = slotMaxR * Math.sqrt(idx / count);
                const th = idx * GOLDEN_ANGLE + rot;
                slots.push({ x: r * Math.cos(th), y: r * Math.sin(th) });
            }
            for (let k = slots.length - 1; k > 0; k--) {
                const j = Math.floor(Math.random() * (k + 1));
                [slots[k], slots[j]] = [slots[j], slots[k]];
            }

            const placed = [];
            const result = new Array(count);

            // 0 = passt; sonst Maß der Verletzung (für den Notfall-Fallback)
            function violation(x, y, r) {
                let v = Math.max(0, Math.hypot(x, y) + r - R_MAX);
                for (const p of placed) {
                    const pen = r + p.r + GAP - Math.hypot(x - p.x, y - p.y);
                    if (pen > 0) v += pen;
                }
                return v;
            }

            // Größte Zeichen zuerst -> bessere Packung
            const order = [...items].sort((a, b) => b.half - a.half);
            order.forEach((item, n) => {
                const slot = slots[n];
                let final = null, best = null, bestV = Infinity;

                for (let step = 0; step < 20 && !final; step++) {
                    const mult = Math.max(0.5, Math.pow(0.92, step));
                    const r = item.half * mult + RING_PAD;
                    const px = item.px * mult;

                    const tryPos = (x, y) => {
                        const v = violation(x, y, r);
                        if (v === 0) { final = { x, y, px, r }; return true; }
                        if (v < bestV) { bestV = v; best = { x, y, px, r }; }
                        return false;
                    };

                    // A: kleine Streuung um den Slot (erhält die Gleichmäßigkeit)
                    outer: for (const jr of [4, 10, 18, 28, 40]) {
                        for (let a = 0; a < 40; a++) {
                            if (tryPos(slot.x + (Math.random() * 2 - 1) * jr,
                                       slot.y + (Math.random() * 2 - 1) * jr)) break outer;
                        }
                    }
                    // B: breite Suche über die ganze Karte
                    for (let a = 0; a < 300 && !final; a++) {
                        const d = Math.sqrt(Math.random()) * Math.max(0, R_MAX - r);
                        const th = Math.random() * Math.PI * 2;
                        tryPos(d * Math.cos(th), d * Math.sin(th));
                    }
                }
                if (!final) final = best; // Notfall: bestes Ergebnis nehmen
                placed.push(final);
                result[item.i] = final;
            });
            return result;
        }

        function svgEl(name, attrs) {
            const el = document.createElementNS(SVG_NS, name);
            for (const k in attrs) el.setAttribute(k, attrs[k]);
            return el;
        }

        function renderCard(id, symbols, layout, common) {
            const el = document.getElementById(id);
            el.innerHTML = '';
            const half = CARD_UNITS / 2;
            const svg = svgEl('svg', { viewBox: `${-half} ${-half} ${CARD_UNITS} ${CARD_UNITS}` });

            symbols.forEach((sym, i) => {
                const p = layout[i];
                const m = SYM_METRICS[sym];

                // Dünner Ring um das Zeichen; beim Auflösen wird der Ring des Treffers rot markiert
                svg.appendChild(svgEl('circle', {
                    class: sym === common ? 'ring highlight' : 'ring',
                    cx: p.x, cy: p.y, r: p.r
                }));

                // Schreibposition so wählen, dass der Mittelpunkt des Zeichenkreises auf (x, y) liegt
                const t = svgEl('text', {
                    class: 'sym',
                    x: p.x - m[0] * p.px,
                    y: p.y + m[1] * p.px,
                    'font-size': p.px
                });
                t.textContent = sym;
                svg.appendChild(t);
            });

            el.appendChild(svg);
        }

        function nextRound() {
            card1Idx = Math.floor(Math.random() * activeCards.length);
            do { card2Idx = Math.floor(Math.random() * activeCards.length); } while (card2Idx === card1Idx);

            layout1 = generateLayout(activeCards[card1Idx]);
            layout2 = generateLayout(activeCards[card2Idx]);
            renderCard('card1', activeCards[card1Idx], layout1);
            renderCard('card2', activeCards[card2Idx], layout2);
        }

        function setCardSet(name) {
            activeCards = CARD_SETS[name];
            for (const n of Object.keys(CARD_SETS)) {
                document.getElementById('set-' + n).classList.toggle('active', n === name);
            }
            nextRound();
        }

        function showSolution() {
            const c1 = activeCards[card1Idx], c2 = activeCards[card2Idx];
            const common = c1.find(s => c2.includes(s));
            renderCard('card1', c1, layout1, common);
            renderCard('card2', c2, layout2, common);
        }

        // Kartengröße = verfügbarer Platz zwischen Titel und Buttons
        function updateCardSize() {
            const main = document.querySelector('main');
            const rect = main.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return;
            const gap = parseFloat(getComputedStyle(main).gap) || 0;
            const sideBySide = window.matchMedia('(orientation: landscape) and (min-width: 768px)').matches;

            let size = sideBySide
                ? Math.min((rect.width - gap) / 2, rect.height)
                : Math.min(rect.width, (rect.height - gap) / 2);
            size = Math.max(MIN_CARD_PX, Math.min(MAX_CARD_PX, size - CARD_SAFETY_MARGIN_PX));

            for (const id of ['card1', 'card2']) {
                const c = document.getElementById(id);
                c.style.width = c.style.height = size + 'px';
            }
        }

        window.addEventListener('resize', updateCardSize);
        window.addEventListener('orientationchange', () => setTimeout(updateCardSize, 50));
        window.addEventListener('load', () => {
            updateCardSize();
            setCardSet('alle');
        });
    </script>

    <script>
        // Service Worker: App funktioniert nach dem ersten Aufruf auch offline.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(err => {
                    console.error('Service-Worker-Registrierung fehlgeschlagen:', err);
                });
            });
        }
    </script>
</body>
</html>
